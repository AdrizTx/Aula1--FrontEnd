<!DOCTYPE html>

<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Aula 07</title>
    </head>
    <body>
        <!-- TABELAS -->

        <!-- 
        <table> = define a tabela
        <thaed> = define a região do cabeçalho
        <tr> = define uma linha da tabela
        <th> = define um cabeçalho (Deixa em negrito)
        <tbody> = define a região do corpo
        <td> = Define uma celula (dados da tabela)
        border = "1" = adiciona bordas na tabela
        -->

        <table border="1">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Idades</th>
                    <th>Cidades</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Adriel</td>
                    <td>16</td>
                    <td>Guarulhos</td>
                </tr>
                <tr>
                    <td>Paulinho</td>
                    <td>15</td>
                    <td>Guarulhos</td>
                </tr>
                <tr>
                    <td>Daniel</td>
                    <td>17</td>
                    <td>Guarulhos</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
