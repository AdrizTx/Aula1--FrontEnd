<!DOCTYPE html>

<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Aula 13 - Entendendo o Display</title>
        <link rel="stylesheet" href="./css/style.css">
    </head>
    <body>
        <h1>Entendendo o Display</h1>

        <p>
            O <strong>display</strong> define como um elemento se comporta na pagina
        </p>

        <!-- BLOCK -->
         <h1>1. Block</h1>

         <div class="block">caixa1</div>
         <div class="block">caixa2</div>
         <div class="block">caixa3</div>

         <!-- INLINE -->
         <h1>2. Inline</h1><br>

         <div class="Inline">Inline1</div>
         <div class="Inline">Inline2</div>
         <div class="Inline">Inline3</div>

         <!-- INLINE BLOCK-->
         <h1>3. Inline Block</h1>

         <div class="Inline-block">InlineBlock1</div>
         <div class="Inline-block">InlineBlock2</div>
         <div class="Inline-block">InlineBlock3</div>
    </body>
</html>
