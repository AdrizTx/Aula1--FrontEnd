<!DOCTYPE html>

<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Aula 8-CSS</title>

        <!-- CSS interno -->
         <!-- ele fica dentro da tag <style> no <head> do HTML -->

            <style>
                h1{
                    color:rgb(255, 0, 76);
                }
            </style>

<!-- ######################################################## -->
        <!-- CSS externo - O MELHOR DE TODOS!!! -->
         <link rel="stylesheet" href="./css/style.css">
<!-- ######################################################## -->

    </head>
    <body>
        <!-- CSS (Cascading style sheets) é o que da forma, cor, design e estilo ao HTML -->

        <!-- CSS inline -->
         <!-- Definindo na tag HTML, dentro do atributo style="" -->
        <h1 style="font-size: 120px;">Titulo em vermelho</h1>
        <!-- Quando usar?
         Quando você precisa estilizar um unico elemento rapidamente(ex: testar uma cor diferente em um botão) -->
         
         <h2>DSI1-SESI - OS MELHORES</h2>
    </body>
</html>
