        <h1>Santos sofre gol relâmpago, mas supera a UCV e avança às oitavas da Sula</h1>
        
        <h2>Apesar de um susto com gol relâmpago tomado aos 18 segundos, o Santos, que teve Neymar entrando no intervalo, venceu a Universidad Central da Venezuela (UCV), na Vila Belmiro, por 4 a 2...</h2>
        
            <img src="./img/AFP__20260415__A7U89ZK__v1__HighRes__FblSudamericanaSantosRecoleta-aspect-ratio-512-320.webp" alt="Um jogador do Santos celebra um gol apontando os dois dedos indicadores para o céu. Sua expressão transmite alegria e gratidão. Ao fundo, é possível ver parte da arquibancada e alguns torcedores desfocados, reforçando o clima de comemoração após o lance decisivo." title="Neymar comemorando">

            <img src="./img/Santos_x_UCV_d794318542.jpg" alt="Os jogadores do Santos estão reunidos em um círculo antes ou durante a partida, com os braços apoiados uns sobre os outros, demonstrando união e espírito de equipe. O goleiro, vestido de preto, observa o grupo ao lado, enquanto o restante da equipe veste o uniforme branco tradicional do clube." title="Jogadores do santos reunidos">

            <img src="./img/Bontempo_Sul_Americana-scaled-aspect-ratio-512-320.webp" alt="Dois jogadores disputam a bola durante uma partida noturna. À esquerda, um atleta do Santos, vestindo o uniforme branco, conduz a bola com concentração enquanto é pressionado por um adversário da Universidad de Concepción, que usa um uniforme azul com mangas vermelhas. Ao fundo, é possível ver outro jogador do Santos e a arquibancada desfocada, destacando a intensidade do lance." title="Disputa de Bola - Gabriel Bontempo">

            <img src="./img/gabigol-comemora-gol-marcado-pelo-santos-contra-a-universidad-central-na-sul-americana-1785289922816_v2_615x300.jpg" alt="Gabigol comemora um gol vestindo a camisa branca do Santos. Ele aparece de frente para a câmera, flexionando os dois braços e mostrando os bíceps em uma comemoração marcante. A iluminação do estádio destaca o jogador, enquanto outros atletas aparecem desfocados ao fundo." title="comemoração de Gabigol">
